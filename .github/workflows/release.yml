name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
      # Tests are not rerun here: a tag is released only if CI passed on
      # that exact commit (Windows, Linux and macOS).
      - name: Require a passing CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" \
            --json conclusion,status \
            -q '[.[] | select(.status == "completed")][0].conclusion')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not passed for $GITHUB_SHA (latest result: ${conclusion:-none}). Push the commit to main, wait for CI, then tag it."
            exit 1
          fi
      - name: Check tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm run build:prod
      - name: Bundle budget (450 KB, production bundle)
        run: node scripts/bundle-budget.mjs --strict
      - name: Package VSIX
        run: pnpm exec vsce package --no-dependencies -o agent-gateway-${{ github.ref_name }}.vsix
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: agent-gateway-${{ github.ref_name }}.vsix
          generate_release_notes: true
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: pnpm exec vsce publish --no-dependencies --packagePath agent-gateway-${{ github.ref_name }}.vsix -p "$VSCE_PAT"
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: pnpm dlx ovsx publish agent-gateway-${{ github.ref_name }}.vsix -p "$OVSX_PAT"
