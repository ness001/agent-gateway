name: Tag package version

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-package-version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create tag when the package version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          version="$(node -p "require('./package.json').version")"
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi

          conclusion="$(gh run list --workflow ci.yml --commit "$sha" \
            --json conclusion,status \
            -q '[.[] | select(.status == "completed")][0].conclusion')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not passed for $sha (latest result: ${conclusion:-none}); refusing to create $tag."
            exit 1
          fi

          git tag "$tag" "$sha"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --ref "$tag"
